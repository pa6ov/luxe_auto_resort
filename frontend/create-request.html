<!DOCTYPE html>
<html lang="bg">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Създай заявка - Luxe Auto Resort</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'DM Sans', sans-serif;
    }

    /* ── Car selection grid ──────────────────────────────────── */
    .car-selection-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    /* Selectable car tile */
    .car-tile {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      background: var(--card, #252525);
      border: 1px solid rgba(75, 136, 162, 0.2);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      user-select: none;
    }

    .car-tile:hover:not(.car-tile--blocked) {
      border-color: var(--accent, #4B88A2);
      background: rgba(75, 136, 162, 0.1);
    }

    .car-tile input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent, #4B88A2);
      cursor: pointer;
      flex-shrink: 0;
    }

    .car-tile-info {
      flex: 1;
      min-width: 0;
    }

    .car-tile-name {
      font-weight: 500;
      font-size: 0.92rem;
      color: var(--text-light, #ECE5F0);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .car-tile-price {
      font-size: 0.82rem;
      color: var(--cta, #E98A15);
      margin-top: 2px;
    }

    /* Selected state */
    .car-tile.car-tile--selected {
      border-color: var(--accent, #4B88A2);
      background: rgba(75, 136, 162, 0.15);
      box-shadow: 0 0 0 1px rgba(75, 136, 162, 0.35);
    }

    /* Blocked / maintenance tile */
    .car-tile--blocked {
      opacity: 0.45;
      cursor: not-allowed;
      border-color: rgba(220, 53, 69, 0.2);
    }

    .car-tile--blocked:hover {
      border-color: rgba(220, 53, 69, 0.2);
      background: var(--card, #252525);
    }

    .car-tile-blocked-label {
      font-size: 0.72rem;
      color: #f08080;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Price chip ──────────────────────────────────────────── */
    .price-chip {
      background: linear-gradient(135deg, rgba(233, 138, 21, 0.18), rgba(233, 138, 21, 0.06));
      border: 1px solid rgba(233, 138, 21, 0.35);
      border-radius: 10px;
      padding: 16px 20px;
      margin-top: 16px;
      display: none;
    }

    .price-chip.show {
      display: block;
    }

    .price-chip-amount {
      font-size: 1.9rem;
      font-weight: 600;
      color: var(--cta, #E98A15);
      line-height: 1;
    }

    .price-chip-detail {
      font-size: 0.82rem;
      color: rgba(236, 229, 240, 0.5);
      margin-top: 5px;
    }

    .price-chip-discount {
      display: inline-block;
      background: rgba(40, 167, 69, 0.15);
      border: 1px solid rgba(40, 167, 69, 0.3);
      color: #6fcf97;
      border-radius: 5px;
      padding: 2px 9px;
      font-size: 0.78rem;
      margin-top: 6px;
    }
  </style>
</head>

<body>
  <header>
    <div class="container">
      <a href="index.html" class="logo">Luxe <span>Auto</span> Resort</a>
      <button class="mobile-menu-btn" onclick="toggleMobileMenu()">☰</button>
      <nav>
        <ul>
          <li><a href="index.html">Начало</a></li>
          <li><a href="cars.html">Автомобили</a></li>
          <li><a href="templates.html">Шаблони</a></li>
          <li><a href="comments.html">Мнения</a></li>
          <li><a href="contacts.html">Контакти</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section class="page-header">
    <div class="container">
      <h1>Създай <span>заявка</span></h1>
      <p>Попълнете формата по-долу, за да направите резервация</p>
    </div>
  </section>

  <section>
    <div class="container">
      <div id="requestFormContainer" style="max-width:820px;margin:0 auto;">
        <div class="loading">Зареждане...</div>
      </div>
    </div>
  </section>

  <footer>
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2024 Luxe Auto Resort. Всички права запазени.</p>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script>
    // ── URL params ─────────────────────────────────────────────────────────
    const urlParams = new URLSearchParams(window.location.search);
    const preselectedTemplate = urlParams.get('template');
    const preselectedCar = urlParams.get('car');
    const preselectedStart = urlParams.get('start');   // passed from cars.html date search
    const preselectedEnd = urlParams.get('end');

    if (!LuxeAuto.auth.isLoggedIn()) {
      window.location.href = 'login.html?redirect=create-request.html';
    }

    // ── State ──────────────────────────────────────────────────────────────
    let selectedCars = [];
    let selectedTemplate = null;
    let allCars = [];   // full list with effective_available

    // ── Helpers ────────────────────────────────────────────────────────────
    function fmtDate(iso) {
      if (!iso) return '—';
      const [y, m, d] = iso.split('-');
      return `${d}.${m}.${y}`;
    }

    // ── Init ───────────────────────────────────────────────────────────────
    async function initForm() {
      const container = document.getElementById('requestFormContainer');

      if (preselectedTemplate) {
        try { selectedTemplate = await LuxeAuto.api.get(`/templates/${preselectedTemplate}`); }
        catch (e) { console.warn('Template not found', e); }
      }

      // Fetch ALL cars — no available=true filter here.
      // We use effective_available from the API to decide what to show/block.
      try {
        allCars = await LuxeAuto.api.get('/cars');
      } catch (e) {
        container.innerHTML = `<div class="alert alert-error">${e.message}</div>`;
        return;
      }

      // Pre-select car from URL if it is actually available
      if (preselectedCar) {
        const car = allCars.find(c => c.id.toString() === preselectedCar);
        if (car && car.effective_available) {
          selectedCars.push(preselectedCar);
        }
      }

      renderForm(container);
    }

    // ── Render ─────────────────────────────────────────────────────────────
    function renderForm(container) {
      const today = new Date().toISOString().split('T')[0];
      const minEnd = new Date(Date.now() + 86400000).toISOString().split('T')[0];

      container.innerHTML = `
        <form id="requestForm">

          <!-- Period -->
          <div class="card" style="margin-bottom:22px;">
            <h3 style="color:var(--cta);margin-bottom:18px;">📅 Период на наем</h3>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;">
              <div class="form-group">
                <label for="start_date">Начална дата *</label>
                <input type="date" id="start_date" name="start_date" required
                       min="${today}" value="${preselectedStart || ''}"
                       onchange="onDateChange()">
              </div>
              <div class="form-group">
                <label for="end_date">Крайна дата *</label>
                <input type="date" id="end_date" name="end_date" required
                       min="${minEnd}" value="${preselectedEnd || ''}"
                       onchange="onDateChange()">
              </div>
            </div>
          </div>

          <!-- Car selection -->
          <div class="card" style="margin-bottom:22px;">
            <h3 style="color:var(--cta);margin-bottom:6px;">🚗 Изберете автомобили *</h3>
            <p style="font-size:0.85rem;color:rgba(236,229,240,0.5);margin-bottom:16px;">
              Автомобилите в сиво са недостъпни за резервация в момента.
            </p>
            <div id="carSelectionGrid" class="car-selection-grid">
              ${renderCarTiles()}
            </div>
          </div>

          <!-- Notes -->
          <div class="card" style="margin-bottom:22px;">
            <h3 style="color:var(--cta);margin-bottom:14px;">📝 Бележки</h3>
            <div class="form-group" style="margin-bottom:0;">
              <textarea id="notes" name="notes" placeholder="Специални изисквания, предпочитания…"></textarea>
            </div>
          </div>

          <!-- Price chip -->
          <div class="price-chip" id="priceChip">
            <div style="font-size:0.78rem;letter-spacing:0.1em;text-transform:uppercase;color:rgba(236,229,240,0.4);margin-bottom:8px;">Обща цена</div>
            <div class="price-chip-amount" id="chipAmount">€0.00</div>
            <div class="price-chip-detail" id="chipDetail"></div>
            <div id="chipDiscount"></div>
          </div>

          <div id="formMessage" style="margin-top:16px;"></div>

          <button type="submit" class="btn btn-primary btn-lg"
                  style="width:100%;margin-top:20px;">
            Изпрати заявка
          </button>
        </form>`;

      document.getElementById('requestForm').addEventListener('submit', submitRequest);

      // Apply template constraints if a template is selected and dates are pre-filled
      if (preselectedStart) {
        onDateChange();
      } else if (preselectedStart && preselectedEnd) {
        updatePrice();
      }
    }

    // ── Car tiles ──────────────────────────────────────────────────────────
    function renderCarTiles() {
      if (!allCars.length) return '<p style="color:rgba(236,229,240,0.4);">Няма налични автомобили.</p>';

      return allCars.map(car => {
        // effective_available = available AND NOT in maintenance right now
        const isBlocked = !car.effective_available;
        const isSelected = selectedCars.includes(car.id.toString());

        // Build the "why blocked" label
        let blockedLabel = '';
        if (isBlocked) {
          if (car.in_maintenance) {
            const reason = car.unavailable_reason || 'В поддръжка';
            const until = car.unavailable_until ? ` до ${fmtDate(car.unavailable_until)}` : '';
            blockedLabel = `${reason}${until}`;
          } else {
            blockedLabel = 'Временно недостъпен';
          }
        }

        const tileClass = [
          'car-tile',
          isBlocked ? 'car-tile--blocked' : '',
          isSelected ? 'car-tile--selected' : '',
        ].filter(Boolean).join(' ');

        return `
          <label class="${tileClass}" id="tile-${car.id}">
            <input type="checkbox"
                   value="${car.id}"
                   ${isSelected ? 'checked' : ''}
                   ${isBlocked ? 'disabled' : ''}
                   onchange="toggleCar(this)">
            <div class="car-tile-info">
              <div class="car-tile-name">${car.brand} ${car.model} (${car.year})</div>
              <div class="car-tile-price">€${parseFloat(car.price_per_day).toFixed(2)} / ден</div>
              ${isBlocked ? `<div class="car-tile-blocked-label">🔒 ${blockedLabel}</div>` : ''}
            </div>
          </label>`;
      }).join('');
    }

    // ── Toggle car selection ───────────────────────────────────────────────
    function toggleCar(checkbox) {
      const id = checkbox.value;
      const tile = document.getElementById(`tile-${id}`);

      if (checkbox.checked) {
        if (!selectedCars.includes(id)) selectedCars.push(id);
        tile?.classList.add('car-tile--selected');
      } else {
        selectedCars = selectedCars.filter(c => c !== id);
        tile?.classList.remove('car-tile--selected');
      }
      updatePrice();
    }

    function onDateChange() {
      const startInput = document.getElementById('start_date');
      const startVal = startInput.value;
      const endInput = document.getElementById('end_date');

      if (startVal) {
        const start = new Date(startVal);

        // Enforce specific start days for Weekend package
        if (selectedTemplate && 
           (selectedTemplate.name.toLowerCase().includes('уикенд') || selectedTemplate.name.toLowerCase().includes('weekend'))) {
          const day = start.getDay();
          // 5 = Friday, 6 = Saturday, 0 = Sunday
          if (day !== 5 && day !== 6 && day !== 0) {
            alert('Уикенд пакетът може да започва само в петък, събота или неделя.');
            startInput.value = '';
            endInput.value = '';
            document.getElementById('priceChip')?.classList.remove('show');
            return;
          }
        }

        if (selectedTemplate && selectedTemplate.duration_days) {
          // Template has a fixed duration, enforce it
          const start = new Date(startVal);
          start.setDate(start.getDate() + selectedTemplate.duration_days);
          const fixedEndStr = start.toISOString().split('T')[0];
          
          endInput.value = fixedEndStr;
          endInput.min = fixedEndStr;
          endInput.max = fixedEndStr;
          endInput.readOnly = true;
          endInput.style.pointerEvents = 'none';
          endInput.style.opacity = '0.6';
        } else {
          // Standard rental, user can choose end date
          const minEnd = new Date(startVal);
          minEnd.setDate(minEnd.getDate() + 1);
          endInput.min = minEnd.toISOString().split('T')[0];
          endInput.max = '';
          endInput.readOnly = false;
          endInput.style.pointerEvents = 'auto';
          endInput.style.opacity = '1';
        }
      }

      const endVal = endInput.value;

      // Re-render tiles to reflect date-specific maintenance overlap
      // (the effective_available on cars from the API is today-based;
      //  here we additionally check if the SELECTED PERIOD hits the window)
      const grid = document.getElementById('carSelectionGrid');
      if (grid) grid.innerHTML = renderCarTilesForDates(startVal, endVal);

      updatePrice();
    }

    function renderCarTilesForDates(startDate, endDate) {
      return allCars.map(car => {
        // Block if: car disabled OR maintenance overlaps the requested period
        const maintOverlaps = startDate && endDate &&
          car.unavailable_from && car.unavailable_until &&
          car.unavailable_from < endDate &&
          car.unavailable_until >= startDate;

        const isBlocked = !car.available || !!maintOverlaps;

        // If currently selected but now blocked → deselect silently
        if (isBlocked && selectedCars.includes(car.id.toString())) {
          selectedCars = selectedCars.filter(c => c !== car.id.toString());
        }

        const isSelected = selectedCars.includes(car.id.toString());

        let blockedLabel = '';
        if (isBlocked) {
          if (car.unavailable_from && car.unavailable_until) {
            const reason = car.unavailable_reason || 'В поддръжка';
            const until = `до ${fmtDate(car.unavailable_until)}`;
            blockedLabel = `${reason} ${until}`;
          } else {
            blockedLabel = 'Временно недостъпен';
          }
        }

        const tileClass = ['car-tile', isBlocked ? 'car-tile--blocked' : '', isSelected ? 'car-tile--selected' : ''].filter(Boolean).join(' ');

        return `
          <label class="${tileClass}" id="tile-${car.id}">
            <input type="checkbox"
                   value="${car.id}"
                   ${isSelected ? 'checked' : ''}
                   ${isBlocked ? 'disabled' : ''}
                   onchange="toggleCar(this)">
            <div class="car-tile-info">
              <div class="car-tile-name">${car.brand} ${car.model} (${car.year})</div>
              <div class="car-tile-price">€${parseFloat(car.price_per_day).toFixed(2)} / ден</div>
              ${isBlocked ? `<div class="car-tile-blocked-label">🔒 ${blockedLabel}</div>` : ''}
            </div>
          </label>`;
      }).join('');
    }

    // ── Price calculation ──────────────────────────────────────────────────
    function updatePrice() {
      const chip = document.getElementById('priceChip');
      const startDate = document.getElementById('start_date')?.value;
      const endDate = document.getElementById('end_date')?.value;

      if (!startDate || !endDate || !selectedCars.length) {
        chip?.classList.remove('show');
        return;
      }

      const start = new Date(startDate);
      const end = new Date(endDate);
      if (end <= start) { chip?.classList.remove('show'); return; }

      const days = Math.ceil((end - start) / (1000 * 60 * 60 * 24));
      let basePrice = 0;
      selectedCars.forEach(id => {
        const car = allCars.find(c => c.id.toString() === id);
        if (car) basePrice += parseFloat(car.price_per_day);
      });

      const discount = selectedTemplate?.discount_percent || 0;
      const totalPrice = basePrice * days * (1 - discount / 100);

      document.getElementById('chipAmount').textContent = `€${totalPrice.toFixed(2)}`;
      document.getElementById('chipDetail').textContent =
        `${days} ${days === 1 ? 'ден' : 'дни'} × ${selectedCars.length} ${selectedCars.length === 1 ? 'автомобил' : 'автомобила'}`;

      const discountEl = document.getElementById('chipDiscount');
      discountEl.innerHTML = discount
        ? `<span class="price-chip-discount">✓ ${discount}% отстъпка (${selectedTemplate?.name})</span>`
        : '';

      chip?.classList.add('show');
    }

    // ── Submit ─────────────────────────────────────────────────────────────
    async function submitRequest(e) {
      e.preventDefault();
      const messageDiv = document.getElementById('formMessage');
      const startDate = document.getElementById('start_date').value;
      const endDate = document.getElementById('end_date').value;

      if (!selectedCars.length) {
        messageDiv.innerHTML = '<div class="alert alert-error">Моля, изберете поне един автомобил.</div>';
        return;
      }
      if (!startDate || !endDate) {
        messageDiv.innerHTML = '<div class="alert alert-error">Моля, посочете началната и крайната дата.</div>';
        return;
      }

      messageDiv.innerHTML = '<div class="loading">Изпращане на заявка...</div>';

      try {
        const data = await LuxeAuto.api.post('/requests', {
          template_id: selectedTemplate?.id || null,
          car_ids: selectedCars.map(id => parseInt(id)),
          start_date: startDate,
          end_date: endDate,
          notes: document.getElementById('notes').value,
        });

        messageDiv.innerHTML = `
          <div class="alert alert-success">
            Заявката е изпратена успешно!<br>
            Обща цена: <strong>€${data.total_price}</strong><br>
            <a href="my-requests.html" style="color:var(--cta);">Вижте вашите заявки →</a>
          </div>`;

        // Reset
        selectedCars = [];
        document.getElementById('requestForm').reset();
        document.getElementById('priceChip').classList.remove('show');
        document.getElementById('carSelectionGrid').innerHTML = renderCarTiles();

      } catch (error) {
        messageDiv.innerHTML = `<div class="alert alert-error">${error.message}</div>`;
      }
    }

    // ── Boot ───────────────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
      updateHeaderForAuth();
      initForm();
    });
  </script>
</body>

</html>
